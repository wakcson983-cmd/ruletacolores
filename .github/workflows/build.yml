name: Build mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        run: gradle build --no-daemon
      - name: Guardar jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ruleta-colores-jar
          path: build/libs/ruleta-colores-*.jar
      - name: Publicar release con el .jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ruleta de Colores v1.0.${{ github.run_number }}
          files: build/libs/ruleta-colores-*.jar
